<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>Configurar servidor</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, 'Segoe UI', sans-serif; }
      body { margin: 0; padding: 24px; background: Canvas; color: CanvasText; }
      h1 { font-size: 1.15rem; margin: 0 0 4px; }
      p { margin: 0 0 16px; font-size: 0.875rem; opacity: 0.75; line-height: 1.4; }
      label { display: block; font-size: 0.875rem; font-weight: 600; margin-bottom: 4px; }
      input { width: 100%; box-sizing: border-box; padding: 9px 10px; font-size: 0.95rem; border: 1px solid GrayText; border-radius: 8px; background: Field; color: FieldText; }
      input[aria-invalid='true'] { border-color: #b3261e; }
      .hint { font-size: 0.78rem; opacity: 0.7; margin: 4px 0 14px; }
      .error { color: #b3261e; font-size: 0.8rem; margin: 4px 0 14px; min-height: 1em; }
      .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }
      button { padding: 9px 16px; font-size: 0.9rem; border-radius: 8px; border: 1px solid GrayText; background: ButtonFace; color: ButtonText; cursor: pointer; }
      button.primary { background: #2f6b3c; border-color: #2f6b3c; color: #fff; font-weight: 600; }
      button:disabled { opacity: 0.6; cursor: default; }
    </style>
  </head>
  <body>
    <h1>Servidor do Tostão</h1>
    <p>Onde está a API que este aplicativo usa. Ao salvar, a janela principal recarrega.</p>
    <form id="form" novalidate>
      <label for="apiUrl">Endereço da API</label>
      <input id="apiUrl" name="apiUrl" type="url" inputmode="url" autocomplete="off" spellcheck="false" placeholder="http://127.0.0.1:8080" />
      <div class="error" id="apiUrl-error" role="alert"></div>

      <label for="apiOrigin">Origem aceita pela API</label>
      <input id="apiOrigin" name="apiOrigin" type="url" inputmode="url" autocomplete="off" spellcheck="false" placeholder="http://localhost:5173" />
      <div class="hint">A origem que a API libera para o navegador (no ambiente local do projeto, http://localhost:5173).</div>
      <div class="error" id="apiOrigin-error" role="alert"></div>

      <div class="actions">
        <button type="button" id="cancel">Cancelar</button>
        <button type="submit" class="primary" id="save">Salvar</button>
      </div>
    </form>
    <script>
      const fields = ['apiUrl', 'apiOrigin']
      const form = document.getElementById('form')
      const save = document.getElementById('save')

      function show(errors) {
        for (const name of fields) {
          const message = errors?.[name] ?? ''
          document.getElementById(`${name}-error`).textContent = message
          document.getElementById(name).setAttribute('aria-invalid', message ? 'true' : 'false')
        }
      }

      window.tostaoSettings.get().then((current) => {
        if (!current) return
        for (const name of fields) document.getElementById(name).value = current[name]
        document.getElementById('apiUrl').focus()
      })

      form.addEventListener('submit', async (event) => {
        event.preventDefault()
        save.disabled = true
        const result = await window.tostaoSettings.save({ apiUrl: form.apiUrl.value, apiOrigin: form.apiOrigin.value })
        save.disabled = false
        if (!result.ok) show(result.errors)
      })
      document.getElementById('cancel').addEventListener('click', () => window.tostaoSettings.cancel())
      document.addEventListener('keydown', (event) => event.key === 'Escape' && window.tostaoSettings.cancel())
    </script>
  </body>
</html>
