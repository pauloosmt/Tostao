spring.application.name=tostao-api

# Banco: tudo por variável de ambiente. Os valores padrão servem só para o Postgres local do Docker Compose.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5442/tostao}
spring.datasource.username=${DB_USER:tostao_app}
spring.datasource.password=${DB_APP_PASSWORD:tostao_app_dev}

# Flyway conecta como dono do schema (cria tabelas, role e políticas); a aplicação usa tostao_app.
spring.flyway.url=${DB_MIGRATION_URL:jdbc:postgresql://localhost:5442/tostao}
spring.flyway.user=${DB_MIGRATION_USER:tostao}
spring.flyway.password=${DB_MIGRATION_PASSWORD:tostao_dev}
spring.flyway.placeholders.app_password=${DB_APP_PASSWORD:tostao_app_dev}

# Schema só por migration Flyway; o Hibernate apenas confere se as entidades batem com ele.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Importação de extratos (spec 013): arquivo de até 2 MB (o corpo maior é recusado com 413 antes de qualquer leitura)
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

# Erros no formato Problem Details (RFC 7807)
spring.mvc.problemdetails.enabled=true

# Corpo JSON com campo desconhecido é recusado (lista de campos permitidos)
spring.jackson.deserialization.fail-on-unknown-properties=true
# Dinheiro é sempre inteiro em centavos: 10.5 num campo inteiro é recusado, não truncado
spring.jackson.deserialization.accept-float-as-int=false

# Sessão: JWT em cookie HttpOnly. Sem valor padrão para o segredo: sobe só com JWT_SECRET definido
# (o perfil "local" traz um valor de desenvolvimento). Secure por padrão; COOKIE_SECURE=false só em local.
tostao.security.jwt-secret=${JWT_SECRET}
tostao.security.cookie-secure=${COOKIE_SECURE:true}
tostao.security.cors-origin=${CORS_ORIGIN:http://localhost:5173}
tostao.security.session-days=365

# Documentação da API: desligada por padrão, ligada só no perfil local
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Só a saúde fica exposta, em /api/v1/health, para passar pelo rewrite /api/* da Vercel.
management.endpoints.web.base-path=/api/v1
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
