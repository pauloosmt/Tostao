spring.application.name=tostao-api

# Banco: tudo por variável de ambiente. Os valores padrão servem só para o Postgres local do Docker Compose.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5442/tostao}
spring.datasource.username=${DB_USER:tostao}
spring.datasource.password=${DB_PASSWORD:tostao_dev}

# Schema só por migration Flyway; o Hibernate apenas confere se as entidades batem com ele.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Erros no formato Problem Details (RFC 7807)
spring.mvc.problemdetails.enabled=true

# Só a saúde fica exposta, em /api/v1/health, para passar pelo rewrite /api/* da Vercel.
management.endpoints.web.base-path=/api/v1
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
