openapi: 3.1.0
info:
  title: Tostão API — Autenticação e Workspace
  version: 0.1.0
  description: >
    Contrato da spec 001. A sessão vai em cookie HttpOnly (tostao_session) definido pela API;
    o cliente nunca monta header Authorization. Erros seguem Problem Details (RFC 7807).
servers:
  - url: /api/v1
paths:
  /auth/register:
    post:
      summary: Cria conta, workspace pessoal e inicia a sessão
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Conta criada e sessão iniciada
          headers:
            Set-Cookie: { $ref: '#/components/headers/SessionCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409':
          description: E-mail já cadastrado
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /auth/login:
    post:
      summary: Entra com e-mail e senha
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Sessão iniciada
          headers:
            Set-Cookie: { $ref: '#/components/headers/SessionCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401':
          description: Credenciais inválidas (mesma resposta para e-mail inexistente e senha errada)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429':
          description: Muitas tentativas; vale também para a senha correta durante o bloqueio
          headers:
            Retry-After:
              description: Segundos até a próxima tentativa permitida
              schema: { type: integer, minimum: 1 }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /auth/logout:
    post:
      summary: Encerra a sessão (apaga o cookie); sem sessão também responde 204
      operationId: logout
      security: []
      responses:
        '204':
          description: Sessão encerrada
          headers:
            Set-Cookie:
              description: Cookie tostao_session com Max-Age=0
              schema: { type: string }
  /auth/logout-all:
    post:
      summary: Sai de todos os aparelhos (invalida todas as sessões da pessoa, inclusive a atual)
      operationId: logoutAll
      security: [{ sessionCookie: [] }]
      responses:
        '204':
          description: Todas as sessões invalidadas; o cookie do aparelho atual também é apagado
          headers:
            Set-Cookie:
              description: Cookie tostao_session com Max-Age=0
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /me:
    get:
      summary: Dados do usuário autenticado e seus workspaces
      operationId: me
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Usuário e workspaces
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /workspaces/{wid}:
    get:
      summary: Dados de um workspace de que o usuário é membro
      operationId: getWorkspace
      security: [{ sessionCookie: [] }]
      parameters:
        - name: wid
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Workspace e papel do usuário nele
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceMembership' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404':
          description: Workspace inexistente ou de outra pessoa (respostas indistinguíveis)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: tostao_session
  headers:
    SessionCookie:
      description: >
        tostao_session=<jwt>; HttpOnly; SameSite=Lax; Path=/api; Max-Age=31536000
        (Secure quando COOKIE_SECURE=true). Reemitido a cada requisição autenticada.
      schema: { type: string }
  responses:
    ValidationError:
      description: Campos inválidos
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ValidationProblem' }
    Unauthenticated:
      description: Sem sessão válida
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [name, email, password]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        email: { type: string, format: email, maxLength: 254 }
        password:
          type: string
          minLength: 8
          maxLength: 72
          description: Ao menos uma letra e um número; no máximo 72 bytes em UTF-8
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, maxLength: 254 }
        password: { type: string, maxLength: 72 }
    Me:
      type: object
      required: [id, name, email, workspaces]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string }
        workspaces:
          type: array
          items: { $ref: '#/components/schemas/WorkspaceMembership' }
    WorkspaceMembership:
      type: object
      required: [id, name, baseCurrency, role]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        baseCurrency: { type: string, example: BRL }
        role: { type: string, enum: [OWNER, EDITOR, VIEWER] }
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
    ValidationProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            errors:
              type: array
              items:
                type: object
                required: [field, message]
                properties:
                  field: { type: string }
                  message: { type: string }
