openapi: 3.1.0
info:
  title: Tostão API — Contas
  version: 0.2.0
  description: >
    Contrato da spec 002. Todas as rotas exigem sessão (cookie tostao_session) e ficam sob um workspace.
    Quem não é membro do workspace recebe 404, igual a um workspace inexistente. VIEWER só consulta
    (403 nas demais operações). Valores monetários são sempre inteiros em centavos. Erros seguem
    Problem Details (RFC 7807).
servers:
  - url: /api/v1
paths:
  /workspaces/{wid}/accounts:
    get:
      summary: Lista as contas do workspace com o saldo calculado de cada uma
      operationId: listAccounts
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/Wid'
        - name: includeArchived
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: Inclui as contas arquivadas
      responses:
        '200':
          description: Contas ordenadas por nome (sem diferenciar maiúsculas)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Account' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      summary: Cria uma conta
      operationId: createAccount
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/Wid'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAccount' }
      responses:
        '201':
          description: Conta criada
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/NameConflict' }
  /workspaces/{wid}/accounts/{id}:
    get:
      summary: Consulta uma conta com o saldo calculado
      operationId: getAccount
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/Wid'
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: A conta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      summary: Edita uma conta ativa (o tipo não muda)
      operationId: updateAccount
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/Wid'
        - $ref: '#/components/parameters/AccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateAccount' }
      responses:
        '200':
          description: Conta atualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Nome já usado por outra conta ativa, ou conta arquivada
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /workspaces/{wid}/accounts/{id}/archive:
    post:
      summary: Arquiva a conta (idempotente)
      operationId: archiveAccount
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/Wid'
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: Conta arquivada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /workspaces/{wid}/accounts/{id}/restore:
    post:
      summary: Restaura uma conta arquivada (idempotente)
      operationId: restoreAccount
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/Wid'
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: Conta ativa
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/NameConflict' }
  /workspaces/{wid}/reports/balance:
    get:
      summary: Saldo de cada conta ativa e o saldo total do workspace
      operationId: balanceReport
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: '#/components/parameters/Wid'
      responses:
        '200':
          description: Contas ativas com saldo e o total, consistentes entre si
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BalanceReport' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: tostao_session
  parameters:
    Wid:
      name: wid
      in: path
      required: true
      schema: { type: string, format: uuid }
    AccountId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    ValidationError:
      description: Campos inválidos
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ValidationProblem' }
    Unauthenticated:
      description: Sem sessão válida
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: O papel da pessoa neste workspace (VIEWER) não permite a operação
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Workspace ou conta inexistente, ou workspace do qual a pessoa não é membro (indistinguíveis)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NameConflict:
      description: Já existe uma conta ativa com este nome
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    AccountType:
      type: string
      enum: [CHECKING, SAVINGS, CASH, CREDIT_CARD, INVESTMENT]
    Cents:
      type: integer
      format: int64
      minimum: -1000000000000
      maximum: 1000000000000
      description: Valor em centavos, sempre inteiro
    CreateAccount:
      type: object
      additionalProperties: false
      required: [name, type, initialBalanceCents]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        type: { $ref: '#/components/schemas/AccountType' }
        initialBalanceCents: { $ref: '#/components/schemas/Cents' }
        creditLimitCents:
          type: integer
          format: int64
          minimum: 0
          maximum: 1000000000000
          description: Só em CREDIT_CARD
        closingDay: { type: integer, minimum: 1, maximum: 31, description: Só em CREDIT_CARD }
        dueDay: { type: integer, minimum: 1, maximum: 31, description: Só em CREDIT_CARD }
    UpdateAccount:
      type: object
      additionalProperties: false
      required: [name, initialBalanceCents]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        type:
          $ref: '#/components/schemas/AccountType'
          description: Opcional; se vier, tem que ser igual ao tipo atual
        initialBalanceCents: { $ref: '#/components/schemas/Cents' }
        creditLimitCents: { type: integer, format: int64, minimum: 0, maximum: 1000000000000 }
        closingDay: { type: integer, minimum: 1, maximum: 31 }
        dueDay: { type: integer, minimum: 1, maximum: 31 }
    Account:
      type: object
      required: [id, name, type, currency, initialBalanceCents, balanceCents, archived, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type: { $ref: '#/components/schemas/AccountType' }
        currency: { type: string, example: BRL }
        initialBalanceCents: { $ref: '#/components/schemas/Cents' }
        balanceCents:
          type: integer
          format: int64
          description: Saldo inicial mais lançamentos não excluídos; calculado a cada consulta
        creditLimitCents: { type: integer, format: int64, nullable: true }
        closingDay: { type: integer, nullable: true }
        dueDay: { type: integer, nullable: true }
        archived: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    BalanceReport:
      type: object
      required: [accounts, totalBalanceCents]
      properties:
        accounts:
          type: array
          items:
            type: object
            required: [id, name, type, balanceCents]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              type: { $ref: '#/components/schemas/AccountType' }
              balanceCents: { type: integer, format: int64 }
        totalBalanceCents:
          type: integer
          format: int64
          description: Soma dos saldos das contas listadas (todas ativas)
    Problem:
      type: object
      required: [title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
    ValidationProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            errors:
              type: array
              items:
                type: object
                required: [field, message]
                properties:
                  field: { type: string }
                  message: { type: string }
